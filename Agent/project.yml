name: AuscultAgent

options:
  bundleIdPrefix: com.yasir.auscult
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    DEVELOPMENT_TEAM: 7J53W37H95
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  AuscultAgent:
    type: application
    platform: iOS
    sources:
      - path: AuscultAgent
      # Compiled in directly rather than linked as a package product: the same
      # source then defines the wire types on both sides with no possibility of
      # the two drifting.
      - path: ../Shared/AuscultProtocol
    # Raises iOS's per-app memory ceiling so RAM Under Pressure can push the
    # device harder before it has to stop short of its own limit. A public
    # capability since iOS 15; automatic signing adds it to the App ID.
    entitlements:
      path: AuscultAgent/AuscultAgent.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yasir.auscult.agent
        PRODUCT_NAME: Auscult Agent
        MARKETING_VERSION: "0.4.6"
        CURRENT_PROJECT_VERSION: "14"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: AuscultAgent/Info.plist
        GENERATE_INFOPLIST_FILE: NO
