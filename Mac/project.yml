# Xcode project for the macOS host, generated by xcodegen.
#
# The SwiftPM package stays the source of truth for AuscultKit; this project
# exists because Developer ID signing and notarisation go through Xcode's
# archive/export pipeline. That pipeline can use a cloud-managed Developer ID
# certificate and submit to the notary service on the account already signed
# into Xcode — no local certificate, app-specific password or API key needed.
# Scripts/bundle-app.sh (ad-hoc signed) remains for quick local builds.
name: Auscult

options:
  bundleIdPrefix: com.yasir
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

packages:
  AuscultPackage:
    path: ..

settings:
  base:
    DEVELOPMENT_TEAM: 7J53W37H95
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    # Required for notarisation. The app spawns xcrun/cfgutil and talks to
    # usbmuxd's socket, all of which hardened runtime allows without extra
    # entitlements; it loads nothing dynamically, so library validation holds.
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"

targets:
  Auscult:
    type: application
    platform: macOS
    sources:
      - path: ../Sources/AuscultApp
      - path: ../Resources/Auscult.icns
        buildPhase: resources
    dependencies:
      - package: AuscultPackage
        product: AuscultKit
      # Shipped inside the bundle so the CLI and app stay in lockstep. Helpers/,
      # not MacOS/: on a case-insensitive disk "auscult" and "Auscult" are the
      # same path, and the CLI would overwrite the app's own executable.
      - target: AuscultCLI
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yasir.auscult
        PRODUCT_NAME: Auscult
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # No App Sandbox: it would deny the usbmuxd socket this app exists to
        # use (measured — see README, "Distribution").
        ENABLE_APP_SANDBOX: NO

  # Target name must differ from the app's by more than case. Xcode keys a
  # target's intermediates directory by target name, and on a case-insensitive
  # disk "Auscult.build" and "auscult.build" are one directory: the targets
  # shared object files and link lists, and the embedded "CLI" came out as a
  # second copy of the GUI app. The product can stay "auscult".
  AuscultCLI:
    type: tool
    platform: macOS
    sources:
      - path: ../Sources/AuscultCLI
    dependencies:
      - package: AuscultPackage
        product: AuscultKit
    settings:
      base:
        PRODUCT_NAME: auscult
        PRODUCT_MODULE_NAME: AuscultCLI
        PRODUCT_BUNDLE_IDENTIFIER: com.yasir.auscult.cli
        # Without this the archive also installs the tool at /usr/local/bin,
        # which turns it into a "generic" archive that cannot be exported as
        # an app. It is embedded in the app instead.
        SKIP_INSTALL: YES

schemes:
  Auscult:
    build:
      targets:
        Auscult: all
    archive:
      config: Release
